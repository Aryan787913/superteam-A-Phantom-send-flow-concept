<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Boards — First ₹500 on Solana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --board:#0E0D14; --panel:#15141B; --card:#1D1C23; --raised:#27262E; --line:#393743;
  --text:#F7F5FB; --muted:#B5B1C0; --faint:#837E90;
  --accent:#AB9FF2; --ink:#211A43;
  --danger:#FF9DA0; --warn:#FFD18A; --ok:#82DDB0;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#070609;font-family:Inter,system-ui,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
.deck{display:flex;flex-direction:column;gap:120px;padding:120px;align-items:center}
.board{position:relative;width:1920px;height:1080px;flex:none;overflow:hidden;background:var(--board);padding:96px 96px 120px;
  background-image:linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);
  background-size:72px 72px;background-position:center}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.kicker{font-size:15px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);font-weight:700}
.bno{font-size:14px;letter-spacing:.2em;color:var(--faint);font-weight:600}
.title{font-size:60px;line-height:1.06;font-weight:800;letter-spacing:-.02em}
.sub{font-size:21px;line-height:1.5;color:var(--muted);margin-top:14px;max-width:1250px}
.foot{position:absolute;left:96px;right:96px;bottom:36px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:18px;font-size:14px;color:var(--faint)}
.foot .fb{display:flex;align-items:center;gap:10px;font-weight:600;color:var(--muted)}
.mark{display:inline-grid;place-items:center;width:24px;height:24px;flex:none}
.row{display:flex;align-items:stretch;min-width:0}
.col{display:flex;flex-direction:column;min-width:0}
.figure{display:flex;flex-direction:column;gap:12px;min-width:0}
.shot{position:relative;flex:none;overflow:hidden;background:#141318;border:1px solid var(--line);border-radius:26px;box-shadow:0 34px 90px rgba(0,0,0,.55)}
.shot img{display:block;width:100%;height:100%;object-fit:cover;object-position:top}
.dshot{border-radius:16px}
.cap{font-size:14px;color:var(--faint);text-align:center;font-weight:600;line-height:1.4}
.tag{align-self:flex-start;font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;padding:8px 15px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.tag.before{color:var(--danger);border-color:rgba(255,157,160,.4);background:rgba(255,157,160,.07)}
.tag.after{color:var(--ok);border-color:rgba(130,221,176,.4);background:rgba(130,221,176,.07)}
.anno{position:absolute;z-index:5;width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--ink);font-size:16px;font-weight:800;display:grid;place-items:center;box-shadow:0 0 0 6px rgba(171,159,242,.16),0 10px 24px rgba(0,0,0,.5)}
.note{display:flex;gap:12px;align-items:flex-start;min-width:0}
.ndot{flex:none;width:27px;height:27px;border-radius:50%;background:var(--accent);color:var(--ink);font-size:14px;font-weight:800;display:grid;place-items:center;margin-top:2px}
.ndot.bad{background:rgba(255,157,160,.15);color:var(--danger)}
.note p{font-size:16px;line-height:1.5;color:var(--muted)}
.note p b{color:var(--text);font-weight:700}
.ph{display:inline-block;color:var(--accent);background:rgba(171,159,242,.09);border:1.5px dashed rgba(171,159,242,.55);padding:2px 12px;border-radius:9px;font-weight:700;white-space:nowrap}
.chipx{font-size:14px;font-weight:600;color:var(--muted);border:1px solid var(--line);background:rgba(255,255,255,.025);padding:8px 15px;border-radius:999px;white-space:nowrap}
.vs{flex:none;align-self:center;width:62px;height:62px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;color:var(--accent);font-size:26px;font-weight:700;background:var(--card)}
.cardx{background:var(--card);border:1px solid var(--line);border-radius:20px}
.mono{font-family:ui-monospace,'Cascadia Mono',Consolas,monospace}
</style>
</head>
<body>
<div class="deck">
</div>
<style>
:root{--faint:#B5B1C0}.board{background-image:none}.title{font-weight:600;letter-spacing:-2px}.shot img{object-fit:contain}.content{margin-top:36px;height:660px}.grid{display:grid;gap:32px}.notes{display:grid;gap:20px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:28px}.panel h3{font-size:24px;margin-bottom:16px;font-weight:600}.panel p{font-size:18px;line-height:1.6;color:var(--muted)}.label{font-size:12px;letter-spacing:2px;color:var(--accent);text-transform:uppercase;margin-bottom:14px}.mobile-shot{width:260px;height:563px}.desktop-shot{width:100%;aspect-ratio:1.6;border-radius:16px}.source-shot{width:100%;height:370px;box-shadow:none}.source-shot img{object-fit:contain}.note p{font-size:17px}.hero-title{font-size:94px;line-height:1.03;letter-spacing:-5px;font-weight:550}.cover-grid{display:grid;grid-template-columns:650px 1fr;gap:64px;margin-top:44px}.hero-art{position:relative;height:630px}.hero-art .desktop-shot{position:absolute;top:25px;right:0;width:850px}.hero-art .mobile-shot{position:absolute;right:10px;top:140px;width:220px;height:476px;border:8px solid var(--board)}.source-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.source-strip .source-shot{height:190px}.state-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}.state-grid .mobile-shot{width:150px;height:325px;margin:auto}.state-grid .desktop-shot{height:162px;margin-top:12px}.state-grid .note{margin-top:14px}.state-grid .note p{font-size:15px}.diagram{display:flex;align-items:center;gap:24px;margin:32px 0}.diagram .panel{flex:1;min-height:160px}.diagram .arrow{font-size:28px;color:var(--accent)}.diagram h3{font-size:21px}.diagram p{font-size:17px}.diagram .step{color:var(--accent);font:13px ui-monospace,monospace;margin-bottom:12px}table{width:100%;border-collapse:collapse;font-size:21px}th,td{text-align:left;padding:24px;border-bottom:1px solid var(--line)}th{font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}.quote{font-size:24px!important;color:var(--accent)!important;line-height:1.5}.link-block{font-size:34px;letter-spacing:-1px;margin:20px 0 32px}.board .smallprint{font-size:14px;line-height:1.6;color:var(--muted)}.foot{bottom:36px}.compact .sub{font-size:18px}.compact .content{margin-top:24px}.caption{font-size:13px;color:var(--muted);margin:10px 0;line-height:1.5}.empty{color:var(--accent)}
</style>
<script>
const cap=(s,d='mobile')=>`../captures/after-${s}-${d}-dark.png`;
const originals=['WhatsApp Image 2026-10-18 at 3.06.17 PM.jpeg','WhatsApp Image 2026-10-18 at 3.06.18 PM (1).jpeg','WhatsApp Image 2026-10-18 at 3.06.18 PM.jpeg','WhatsApp Image 2026-10-18 at 3.06.19 PM (1).jpeg','WhatsApp Image 2026-10-18 at 3.06.19 PM (2).jpeg','WhatsApp Image 2026-10-18 at 3.06.19 PM.jpeg','WhatsApp Image 2026-10-18 at 3.06.20 PM.jpeg'];
const shot=(src,cls,alt)=>`<div class="shot ${cls}"><img src="${encodeURI(src)}" alt="${alt}"></div>`;
const source=i=>shot('../before/'+originals[i],'source-shot',`Current Phantom original ${i+1}`);
const note=(n,title,text)=>`<div class="note"><span class="ndot">${n}</span><p><b>${title}</b><br>${text}</p></div>`;
function board(id,kicker,title,sub,body,cls=''){document.querySelector('.deck').insertAdjacentHTML('beforeend',`<section class="board ${cls}" id="${id}" aria-label="${title}"><header><div class="head"><div class="kicker">${kicker}</div><div class="bno">${id.slice(0,2)} / 07</div></div><h1 class="title">${title}</h1>${sub?`<p class="sub">${sub}</p>`:''}</header>${body}<footer class="foot"><span class="fb">Aaryan Singh · First ₹500 on Solana</span><span>Concept redesign · Not affiliated with Phantom</span></footer></section>`)}
board('01-cover','Superteam India / Design Bounty','First ₹500 on Solana','',`<div class="cover-grid"><div><h2 class="hero-title">A familiar amount.<br><span style="color:var(--accent)">An unfamiliar<br>risk.</span></h2><p class="sub" style="font-size:25px;margin:28px 0">Making Phantom's send flow scam-proof and clear for newcomers</p><p class="smallprint">“Scam-proof” is the ambition, not a guarantee. This concept reduces one address-confusion risk.</p><p style="font-size:18px;margin:26px 0">Aaryan Singh · Superteam India Design Bounty</p><div class="panel"><div class="label">Task time · awaiting participant testing</div><div style="font-size:25px;color:var(--accent)">[BEFORE_TIME] → [AFTER_TIME]</div></div></div><div><div class="hero-art">${shot(cap('warning','desktop'),'desktop-shot','Wide recipient comparison')}${shot(cap('warning'),'mobile-shot','Mobile lookalike warning')}</div>${note(1,'Check the middle. Not just the ends.','A full-address comparison before an irreversible send.')}</div></div>`);
board('02-problem','Problem & Evidence','A familiar-looking address is not a familiar person.','Who it hurts: Indian first-time senders used to UPI names, now checking long wallet addresses.',`<div class="content"><div class="diagram"><div class="panel"><div class="step">01 / SEED</div><h3>Attacker sends dust</h3><p>A tiny unsolicited transfer creates a history entry.</p></div><span class="arrow">→</span><div class="panel"><div class="step">02 / RESEMBLE</div><h3>A lookalike appears in history</h3><p>The visible first and last characters resemble a trusted address.</p></div><span class="arrow">→</span><div class="panel"><div class="step">03 / MISDIRECT</div><h3>Victim copies the wrong address</h3><p>A later payment goes to a different destination.</p></div></div><div class="panel"><p style="color:var(--text)">Feb 2026: a Phantom user lost ~$264K to address poisoning (Cointelegraph, 10 Feb 2026)</p><p class="smallprint" style="margin-top:10px">Brief-supplied citation. Article URL and incident details require verification before publication; not independently verified here.</p></div><div class="grid" style="grid-template-columns:repeat(3,1fr);margin-top:32px">${note(1,'Cash or SOL?','Designer-reported: an empty wallet’s Send list showed only Cash. The meaning was unclear.')}${note(2,'Fees in SOL','Design hypothesis: INR-first users need a familiar fee estimate, with SOL still visible.')}${note(3,'Vague errors','Design hypothesis: a fee failure needs a specific explanation and a safe next step.')}</div><div class="panel" style="margin-top:32px"><p class="smallprint">Phantom already has history, P&amp;L, transaction simulation, a malicious-site blocklist and spam-token hiding. This concept complements them. No claim is made that these protections are missing.</p></div></div>`);
board('03-safe-send-mobile','Feature 1 / Mobile','People first. Full addresses when it matters.','Current Phantom evidence is preserved; proposed recipient protections are shown separately.',`<div class="content grid" style="grid-template-columns:360px 300px 300px 1fr;gap:40px"><div><div class="label">Before / Current Phantom</div>${source(0)}<p class="caption">Original 01 · Unaltered supplied screenshot.<br>Screen-to-feature mapping requires human verification.</p><div class="panel"><p class="smallprint">This source is context, not proof that Phantom lacks contacts or recipient warnings.</p></div></div><div><div class="label">After / Recipient</div>${shot(cap('recipient'),'mobile-shot','Contact-first recipient screen')}</div><div><div class="label">After / Warning</div>${shot(cap('warning'),'mobile-shot','Full-address warning screen')}</div><div class="notes" style="align-content:start;padding-top:40px">${note(1,'Known people first','Saved contacts sit above recent addresses. A sender is not automatically trusted.')}${note(2,'No hidden middle','Unsaved addresses stay fully visible and chunked. Possible spam is collapsed.')}${note(3,'A visual fingerprint','The full address generates the pattern. It is a cue, not identity verification.')}${note(4,'Safer default action','Use the saved contact. Continuing with the mismatch requires a deliberate hold.')}</div></div>`);
board('04-safe-send-desktop','Feature 1 / Desktop','More room. A more deliberate comparison.','A desktop-native sidebar, send progress and full addresses side by side.',`<div class="content grid" style="grid-template-columns:280px 1fr 1fr;gap:30px"><div><div class="label">Before / Current Phantom</div>${source(1)}<p class="caption">Original 02 · Source layout preserved. Not a reconstructed desktop variation.</p>${note(1,'Evidence boundary','No matching current-app warning screen has been verified.')}</div><div><div class="label">After / Recipient</div>${shot(cap('recipient','desktop'),'desktop-shot','Desktop recipient workspace')}<div class="notes" style="margin-top:32px">${note(2,'Persistent context','Asset, recipient, amount and review form one visible path.')}${note(3,'Names before history','Contacts remain the starting point; full untrusted addresses remain inspectable.')}</div></div><div><div class="label">After / Address comparison</div>${shot(cap('warning','desktop'),'desktop-shot','Desktop side-by-side lookalike comparison')}<div class="notes" style="margin-top:32px">${note(4,'Compare, don’t memorize','Look across two full addresses. Only differing chunks are highlighted.')}${note(5,'Different address, different pattern','Fingerprints add a second visual cue, never a safety verdict.')}</div></div></div>`);
board('05-plain-language','Feature 2 / Mobile + Desktop','Less translation. More understanding.','Before: source evidence only. After: proposed amount, review, failure and receipt states.',`<div class="content"><div class="grid" style="grid-template-columns:270px 1fr;gap:32px"><div><div class="label">Before / Current Phantom</div><div class="source-strip" style="grid-template-columns:1fr 1fr">${[2,3,4,5].map(i=>`<div>${source(i)}<p class="caption">Original ${i+1}</p></div>`).join('')}</div><p class="smallprint">No verified matching before state exists for every proposal. Fee confusion and error clarity are hypotheses, not screenshot findings.</p></div><div class="state-grid">${[['amount','Think in rupees','INR first, SOL alongside; network fees remain visible.'],['review','Read it in one sentence','What, how much and to whom, before confirmation.'],['failure','Know what to fix','Explain the missing fee balance. Review the corrected amount.'],['success','Know what happened','A clear receipt, followed by saving a verified recipient.']].map(([s,t,p],i)=>`<div><div class="label">After / ${s}</div>${shot(cap(s),'mobile-shot',`${s} mobile`)}${shot(cap(s,'desktop'),'desktop-shot',`${s} desktop`)}${note(i+1,t,p)}</div>`).join('')}</div></div></div>`,'compact');
board('06-test-results','Validation / Planned study','A clearer flow is a hypothesis. Test it.','Planned method: 5 non-crypto participants · 2 tasks · No sessions completed; all outcomes pending.',`<div class="content grid" style="grid-template-columns:420px 1fr;gap:48px"><div class="notes" style="align-content:start">${note(1,'Task A: send ₹50 to Rahul','Record completion time, errors, hesitations and confidence on a 1–5 scale.')}${note(2,'Task B: spot the unsafe address','Observe whether participants verify the mismatch or continue to the wrong recipient.')}${note(3,'Compare fairly','Use a safe interactive baseline with fictional data, not the static Before viewer. Record assistance and order effects.')}<div class="panel"><p class="smallprint">Obtain recording consent. Never request real funds, wallet access, seed phrases or private keys. Report all five participants, including failures.</p></div></div><div><table><thead><tr><th>Metric</th><th>Before</th><th>After</th></tr></thead><tbody><tr><td>Task A time</td><td class="empty">[BEFORE_TIME]</td><td class="empty">[AFTER_TIME]</td></tr><tr><td>Errors</td><td class="empty">[BEFORE_ERRORS]</td><td class="empty">[AFTER_ERRORS]</td></tr><tr><td>Confidence / 5</td><td class="empty">[BEFORE_CONF]</td><td class="empty">[AFTER_CONF]</td></tr></tbody></table><div class="grid" style="grid-template-columns:1fr 1fr;margin-top:32px"><div class="panel"><div class="label">Participant quote / pending</div><p class="quote">[PARTICIPANT_QUOTE_1]</p></div><div class="panel"><div class="label">Participant quote / pending</div><p class="quote">[PARTICIPANT_QUOTE_2]</p></div></div><p class="smallprint" style="margin-top:24px">Placeholders are intentionally visible. No improvement, participant quote or success rate has been invented.</p></div></div>`);
board('07-links','Links & Credits','A small send. A more confident start.','Aaryan Singh · Mumbai · Final-year CS student',`<div class="content grid" style="grid-template-columns:1fr 560px;gap:80px"><div><div class="panel"><div class="label">Explore the live prototype</div><div class="link-block empty">[LIVE_LINK]</div>${note(1,'Follow the risky path','Recipient → lookalike warning → saved contact → amount → review.')}</div><div class="panel" style="margin-top:24px"><div class="label">Watch the walkthrough</div><div class="link-block empty">[LOOM_LINK]</div>${note(2,'See the reasoning','The problem, two focused interventions and an honest testing plan.')}</div><p style="font-size:26px;margin-top:32px">Concept redesign. Not affiliated with Phantom.</p></div><div><div class="label">Credits & boundaries</div><h2 style="font-size:42px;letter-spacing:-1.5px;line-height:1.15;margin-bottom:24px">Designed for the<br>first-time sender.</h2><p class="sub" style="font-size:19px">Original product: Phantom.<br>Design &amp; prototype: Aaryan Singh.<br>Typography: Inter.<br>Platform: Solana.<br>Submitted for Superteam India.</p><div class="panel" style="margin-top:32px"><p>Illustrative rates and transactions. No funds move. Address fingerprints are visual cues, not authentication. No wallet can guarantee scam-proof transfers.</p></div><p class="smallprint" style="margin-top:24px">Evidence: seven supplied Phantom screenshots; incident citation pending source verification. Participant research is planned, not completed.</p>${note(3,'Before publishing','Verify sources, replace links, run the study and inspect screenshots for private data.')}</div></div>`);
// Final presentation copy and source mappings.
const get=id=>document.getElementById(id);
function replaceText(root,from,to){const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);while(walker.nextNode())walker.currentNode.textContent=walker.currentNode.textContent.replaceAll(from,to)}
function removeText(root,start){for(const el of root.querySelectorAll('p'))if(el.textContent.startsWith(start))el.remove()}
replaceText(document.querySelector('.deck'),'scam-proof','scam-resistant');
replaceText(document.querySelector('.deck'),'Scam-proof','Scam-resistant');
for(const foot of document.querySelectorAll('.foot>span:last-child'))foot.textContent='Superteam India · Design Bounty';
const cover=get('01-cover');
cover.querySelector('.kicker').textContent='First ₹500 on Solana';cover.querySelector('header .title').remove();
cover.querySelector('.cover-grid .sub').textContent="Making Phantom's send flow scam-resistant and clear for first-time senders.";
removeText(cover,'“Scam-resistant”');
cover.querySelector('.panel .label').textContent='Before → After / Task time';
const problem=get('02-problem');
removeText(problem,'Brief-supplied citation.');
const incident=problem.querySelector('.content>.panel');incident.classList.add('incident-card');
incident.innerHTML='<div class="label">The cost of a familiar-looking address</div><h2>~$264K lost.</h2><p>Feb 2026: a Phantom user lost ~$264K to address poisoning.</p><p class="smallprint">Cointelegraph, 10 Feb 2026 · “Phantom Chat Triggers Address Poisoning Concerns After User Loses $264K”</p>';
const points=problem.querySelector('.content>.grid');points.innerHTML=note(1,'Cash or SOL?',"A new wallet’s Send list showed only Cash, which is confusing when you need SOL.")+note(2,'Fees in SOL','First-timers think in rupees.')+note(3,'Vague errors','A failed send should say why and what to do.');
const existing=problem.querySelector('.content>.panel:last-child');existing.querySelector('p').textContent='Phantom already has history, P&L, transaction simulation, a malicious-site blocklist and spam-token hiding. This concept builds on those protections.';incident.after(existing);
const mobile=get('03-safe-send-mobile');mobile.querySelector('header .sub').textContent='Recognize the person. Inspect the address. Confirm the destination.';
const before=mobile.querySelector('.content>div');before.querySelector('.source-shot').outerHTML=source(1);before.querySelector('.caption').textContent='Current Phantom: the recipient is shown shortened (9WzD…AWWM). The middle, where poisoned addresses differ, is hidden.';before.querySelector('.panel').remove();
before.querySelector('.source-shot').insertAdjacentHTML('beforeend','<span class="anno source-dot">2</span>');
replaceText(mobile,'It is a cue, not identity verification.','Compare its pattern alongside the full address.');
const desktop=get('04-safe-send-desktop');desktop.querySelector('.content>div .label').textContent='Current Phantom (mobile reference)';desktop.querySelector('.caption').remove();desktop.querySelector('.content>div .note').outerHTML=note(1,'Shortened by default','Current Phantom shows only the first and last 4 characters, the exact part attackers copy.');replaceText(desktop,'Fingerprints add a second visual cue, never a safety verdict.','Full-address fingerprints make the two destinations visually distinct.');
const plain=get('05-plain-language');plain.querySelector('.kicker').textContent='Feature 2 / Plain-language moments';plain.querySelector('header .sub').textContent='Familiar amounts. Clear decisions. A useful next step when something goes wrong.';
plain.querySelector('.content').innerHTML=`<div class="plain-grid"><div class="plain-before"><div class="label">Before / Current Phantom</div>${source(2)}${source(3)}<p class="caption">Current Phantom: amounts in $, errors as short red text.</p></div>${[['amount','Think in rupees','INR first. SOL and the fee stay visible.'],['review','One clear sentence','What, how much and to whom.'],['failure','A useful next step','Explain the fee. Offer a reviewed fix.'],['success','A clear receipt','Confirm the send. Save the recipient.']].map(([s,t,p],i)=>`<div class="plain-state"><div class="label">After / ${s}</div>${shot(cap(s),'mobile-shot',`${s} mobile`)}${note(i+1,t,p)}</div>`).join('')}</div>`;
const results=get('06-test-results');results.querySelector('.kicker').textContent='VALIDATION';results.querySelector('.title').textContent='Testing with 5 first-time senders.';results.querySelector('header .sub').textContent='Study design: 5 participants with no crypto experience · 2 tasks · before vs after.';replaceText(results,'Participant quote / pending','Participant quote');removeText(results,'Placeholders are intentionally visible.');
const links=get('07-links');links.querySelector('.content>div>p').textContent='Concept redesign. Illustrative data. Fingerprints are a visual cue, not identity verification. Not affiliated with Phantom.';links.querySelector('.content>div>p').style.fontSize='18px';links.querySelector('.content>div>p').style.lineHeight='1.7';const credits=links.querySelector('.content>div:last-child');credits.querySelector('.label').textContent='Credits';credits.querySelector('.panel').remove();removeText(credits,'Evidence:');credits.querySelector('.note').remove();replaceText(links,'The problem, two focused interventions and an honest testing plan.','The problem, two focused interventions and the testing approach.');
</script>
<style>
#01-cover{isolation:isolate}.cover-grid{grid-template-columns:600px 1fr;gap:48px;margin-top:64px}.hero-title{font-size:86px}.hero-art{display:flex;gap:20px;align-items:center;height:610px}.hero-art .desktop-shot{position:static;width:790px;flex:1;min-width:0}.hero-art .mobile-shot{position:static;width:240px;height:520px;flex:none;border:1px solid var(--line)}.incident-card{display:grid;grid-template-columns:350px 1fr;gap:12px 32px;border-color:#AB9FF266;background:linear-gradient(110deg,#211a36,#15141b)}.incident-card .label{grid-column:1/-1;margin:0}.incident-card h2{font-size:64px;letter-spacing:-3px;font-weight:550;grid-row:2/4}.incident-card p{font-size:23px}.incident-card p.smallprint{font-size:14px}.source-dot{right:22px;top:43%}.source-dot:after{content:'';position:absolute;right:34px;top:16px;width:65px;height:2px;background:var(--accent)}.plain-grid{display:grid;grid-template-columns:270px repeat(4,minmax(0,1fr));gap:24px}.plain-before .source-shot{height:265px;margin-bottom:16px}.plain-state .mobile-shot{width:100%;height:640px;border-radius:20px}.plain-state .note{margin-top:16px}.plain-state .note p{font-size:16px;line-height:1.4}.plain-state .label{margin-bottom:10px}#05-plain-language .content{margin-top:24px}
</style>
<style>
